<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próxima Apertura - Tijuana</title>
    <link rel="stylesheet" href="Contador.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="galaxy-background"></div>
    
    <main class="coming-soon-container">
        <h1 class="main-title">PRÓXIMA APERTURA</h1>

        <div class="countdown-timer">
            <div class="timer-card">
                <div class="timer-value" id="days">00</div>
                <div class="timer-label">DÍAS</div>
            </div>
            <div class="timer-card">
                <div class="timer-value" id="hours">00</div>
                <div class="timer-label">HORAS</div>
            </div>
            <div class="timer-card">
                <div class="timer-value" id="minutes">00</div>
                <div class="timer-label">MINUTOS</div>
            </div>
            <div class="timer-card">
                <div class="timer-value" id="seconds">00</div>
                <div class="timer-label">SEGUNDOS</div>
            </div>
        </div>

        <p class="description">
            Prepárate para experimentar la innovación tecnológica más avanzada de Tijuana. Soluciones digitales que transformarán tu futuro.
        </p>

        <a href="#" class="learn-more-btn">SABER MÁS</a>
    </main>
    
    <script src="Contador.js"></script>
</body>
</html>
